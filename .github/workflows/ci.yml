name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile-check all Python sources
        run: |
          python -m py_compile app.py backend/*.py backend/db/*.py backend/tests/*.py
          echo "All Python files compile cleanly."

      - name: Run Test Suite
        run: |
          python run_tests.py

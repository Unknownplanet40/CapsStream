name: Semantic Version Auto Release

on:
  push:
    branches:
      - main
      - rebuild/*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: detect bump from commits, update VERSION + version.json,
  #           commit, tag, push.
  semantic-bump:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      skip: ${{ steps.tagged.outputs.skip }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      current_version: ${{ steps.bump.outputs.current_version }}
      changelog: ${{ steps.commits.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Skip if HEAD is already tagged
        id: tagged
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged — nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump from commits
        id: bump
        if: steps.tagged.outputs.skip != 'true'
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+(\.[0-9]+){1,3}$' | head -n 1 || true)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag → assuming 0.0.0.0"
            RANGE=""
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          LOG=$(git log ${RANGE:+"$RANGE"} --pretty=format:%s || echo "")

          echo "DEBUG: Commit subjects since last tag:"
          echo "$LOG" | sed 's/^/  - /; s/^$/  (empty line)/'

          BUMP_TYPE="none"

          if echo "$LOG" | grep -qiE "(BREAKING CHANGE|!:|\+semver:\s*(major|breaking))"; then
            BUMP_TYPE="major"
          elif echo "$LOG" | grep -qiE "^feat(\(.+\))?:|^feature:|\+semver:\s*minor"; then
            BUMP_TYPE="minor"
          elif echo "$LOG" | grep -qiE "^fix:|^docs:|^style:|^refactor:|^perf:|^test:|^chore:"; then
            BUMP_TYPE="patch"
          fi

          echo "DEBUG: Detected BUMP_TYPE='$BUMP_TYPE'"

          if [ "$BUMP_TYPE" = "none" ]; then
            if [ -z "$LOG" ]; then
              echo "No new commits → skipping"
            else
              echo "Commits exist but no recognized conventional prefix → skipping bump (add 'fix:', 'feat:', etc.)"
            fi
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          CURRENT=$(tr -d ' \n\r' < VERSION)
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

          CLEAN_VERSION="${CURRENT%%[-+]*}"

          if ! [[ $CLEAN_VERSION =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Warning: Invalid version '$CURRENT' → reset to 2.0.0.0"
            CLEAN_VERSION="2.0.0.0"
          fi

          # CapsStream scheme: Major.Minor.Build.Revision
          IFS='.' read -r MAJOR MINOR BUILD REVISION <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          BUILD=${BUILD:-0}
          REVISION=${REVISION:-0}

          case "$BUMP_TYPE" in
            major) ((MAJOR += 1)); MINOR=0; BUILD=0; REVISION=0 ;;
            minor) ((MINOR += 1)); BUILD=0; REVISION=0 ;;
            patch) ((BUILD += 1)); REVISION=0 ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$BUILD.$REVISION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bump → $BUMP_TYPE ($CURRENT → $NEW_VERSION)"

      - name: Collect commit list for the changelog
        id: commits
        if: steps.tagged.outputs.skip != 'true' && steps.bump.outputs.skip != 'true'
        shell: bash
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+(\.[0-9]+){1,3}$' | head -n 1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE=""
          fi
          {
            echo "list<<CHANGELOG_EOF"
            git log ${RANGE:+"$RANGE"} --pretty=format:"- %s (%h)" || echo "- Initial release"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update VERSION + version.json
        if: steps.tagged.outputs.skip != 'true' && steps.bump.outputs.skip != 'true'
        env:
          NEW_VER: ${{ steps.bump.outputs.new_version }}
          REPO: ${{ github.repository }}
        run: |
          echo "$NEW_VER" > VERSION
          URL="https://github.com/${REPO}/releases/download/v${NEW_VER}/CapsStream-update-${NEW_VER}.zip"
          jq --arg v "$NEW_VER" --arg u "$URL" \
            '.version = $v | .download_url = $u' version.json > tmp.json \
            && mv tmp.json version.json

      - name: Commit version bump
        if: steps.tagged.outputs.skip != 'true' && steps.bump.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION version.json

          git diff --staged --quiet || \
            git commit -m "chore(release): ${{ steps.bump.outputs.bump_type }} bump to ${{ steps.bump.outputs.new_version }} [skip ci]"

      - name: Push version bump commit
        if: steps.tagged.outputs.skip != 'true' && steps.bump.outputs.skip != 'true'
        run: git push

      - name: Create & push git tag
        if: steps.tagged.outputs.skip != 'true' && steps.bump.outputs.skip != 'true'
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          git tag "v${NEW_VER}"
          git push origin "v${NEW_VER}"

  # ── Job 2: build the code-only zip and publish the GitHub Release.
  #           Runs in the SAME workflow (GITHUB_TOKEN tag pushes can't
  #           trigger other workflows, so this must live here).
  release:
    needs: semantic-bump
    if: needs.semantic-bump.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.semantic-bump.outputs.new_version }}

      - name: Verify VERSION matches the tag
        shell: bash
        run: |
          TAG="${{ needs.semantic-bump.outputs.new_version }}"
          FILE_VER=$(tr -d ' \n\r' < VERSION)
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::VERSION ($FILE_VER) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build code-only update zip
        shell: bash
        run: |
          NEW_VER="${{ needs.semantic-bump.outputs.new_version }}"
          ZIP="CapsStream-update-${NEW_VER}.zip"
          zip -r "$ZIP" \
            app.py \
            backend \
            -x "backend/__pycache__/*" "backend/**/__pycache__/*"
          zip "$ZIP" \
            static/js/app.js \
            static/css/main.css \
            static/img/favicon.png \
            static/sfx/bell.wav \
            templates/index.html \
            requirements.txt \
            start.bat \
            update.bat \
            VERSION
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-bump.outputs.new_version }}
          name: CapsStream v${{ needs.semantic-bump.outputs.new_version }}
          body: |
            **Type**: ${{ needs.semantic-bump.outputs.bump_type }}
            **From**: ${{ needs.semantic-bump.outputs.current_version }}
            **To**: ${{ needs.semantic-bump.outputs.new_version }}

            **Commits**:
            ${{ needs.semantic-bump.outputs.changelog }}

            Auto-released via conventional commits.
          generate_release_notes: true
          files: ${{ env.ZIP }}

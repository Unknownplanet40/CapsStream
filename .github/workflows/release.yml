name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the changelog

      - name: Verify VERSION matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VER=$(tr -d ' \n\r' < VERSION)
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::VERSION ($FILE_VER) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build code-only update zip
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ZIP="CapsStream-update-${TAG}.zip"
          zip -r "$ZIP" \
            app.py \
            backend \
            -x "backend/__pycache__/*" "backend/**/__pycache__/*" \
          || true
          zip -r "$ZIP" \
            backend \
            -x "backend/__pycache__/*" "backend/**/__pycache__/*"
          zip "$ZIP" \
            static/js/app.js \
            static/css/main.css \
            static/img/favicon.png \
            static/sfx/bell.wav \
            templates/index.html \
            requirements.txt \
            start.bat \
            update.bat \
            VERSION
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-decorate --oneline "$PREV..${GITHUB_REF_NAME}")
          else
            LOG=$(git log --no-decorate --oneline "${GITHUB_REF_NAME}")
          fi
          # Write to a temp file so multi-line output survives
          echo "$LOG" > changelog.txt
          {
            echo "CHANGLEOG<<EOF"
            echo "## Changes in ${GITHUB_REF_NAME}"
            echo ""
            cat changelog.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "$ZIP" \
            --title "CapsStream ${GITHUB_REF_NAME}" \
            --notes "$(cat changelog.txt | sed 's/^/- /' | sed "s/^/ /")"

      - name: Update version.json in the repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "CapsStream Release Bot"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main
          TAG="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/CapsStream-update-${TAG}.zip"
          cat > version.json <<EOF
          {
            "name": "CapsStream",
            "version": "${TAG}",
            "channel": "stable",
            "download_url": "${URL}"
          }
          EOF
          git add version.json
          git commit -m "chore: point version.json at release ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin main

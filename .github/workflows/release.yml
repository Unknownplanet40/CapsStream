name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the changelog

      - name: Verify VERSION matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VER=$(tr -d ' \n\r' < VERSION)
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::VERSION ($FILE_VER) does not match tag ($TAG)"
            exit 1
          fi

      - name: Build code-only update zip
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ZIP="CapsStream-update-${TAG}.zip"
          # Package ENTIRE trees (not a hardcoded file list) so newly added
          # files are always included in updates.
          zip -r "$ZIP" \
            app.py \
            requirements.txt \
            start.bat \
            update.bat \
            silent_launcher.py \
            "Start CapsStream Silent.vbs" \
            VERSION \
            backend \
            routes \
            static \
            templates \
            -x "*__pycache__*" "*.pyc" "*.pyo"

          # Gate: refuse to publish an incomplete package
          for f in app.py VERSION backend routes static/js/app.js static/css/main.css static/img/icon-192.png static/img/icon-512.png templates/index.html; do
            if ! unzip -l "$ZIP" | grep -q "$f"; then
              echo "::error::Update zip is missing critical file: $f"
              exit 1
            fi
          done

          sha256sum "$ZIP" > sha256sums.txt
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          # \x1e separates commits so multi-line bodies stay in one awk record
          git log --pretty=format:"%h%x09%s%x09%b%x1e" "$RANGE" | awk -F'\t' '
          BEGIN { RS = "\x1e" }
          {
            sub(/\n$/, "")
            if ($0 == "" || $2 == "") next
            printf "- %s (%s)\n", $2, $1
            if ($3 != "") {
              n = split($3, lines, "\n")
              for (i = 1; i <= n; i++)
                if (lines[i] != "") printf "  %s\n", lines[i]
            }
            printf "\n"
          }' > changelog.txt
          # Write to a temp file so multi-line output survives
          {
            echo "CHANGLEOG<<EOF"
            echo "## Changes in ${GITHUB_REF_NAME}"
            echo ""
            cat changelog.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 for Android TV APK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android TV Companion APK
        working-directory: clients/android-tv
        run: |
          gradle assembleDebug --stacktrace
          TAG="${GITHUB_REF_NAME#v}"
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "../../CapsStream-AndroidTV-${TAG}.apk"
            cp "$APK_SRC" "../../CapsStream-AndroidTV.apk"
            cd ../..
            sha256sum "CapsStream-AndroidTV-${TAG}.apk" >> sha256sums.txt
            sha256sum "CapsStream-AndroidTV.apk" >> sha256sums.txt
          else
            echo "::warning::Android TV APK not found at $APK_SRC"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RELEASE_ASSETS=("$ZIP" sha256sums.txt)
          for apk in CapsStream-AndroidTV*.apk; do
            [ -f "$apk" ] && RELEASE_ASSETS+=("$apk")
          done
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_ASSETS[@]}" \
            --title "CapsStream ${GITHUB_REF_NAME}" \
            --notes "$(cat changelog.txt | sed 's/^/- /' | sed "s/^/ /")"

      - name: Wait until the release asset is actually downloadable
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/CapsStream-update-${TAG}.zip"
          CODE="000"
          for i in $(seq 1 24); do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
              echo "Asset is downloadable (HTTP $CODE) after attempt $i"
              break
            fi
            echo "Attempt $i: HTTP $CODE — waiting…"
            sleep 5
          done
          if [ "$CODE" != "200" ] && [ "$CODE" != "302" ]; then
            echo "::error::Release asset never became downloadable — NOT updating version.json so clients keep the previous working release."
            exit 1
          fi

      - name: Update version.json in the repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "CapsStream Release Bot"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main
          TAG="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/CapsStream-update-${TAG}.zip"
          cat > version.json <<EOF
          {
            "name": "CapsStream",
            "version": "${TAG}",
            "channel": "stable",
            "download_url": "${URL}"
          }
          EOF
          git add version.json
          git commit -m "chore: point version.json at release ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin main

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#050508">
  <meta name="description" content="CapsStream — Your personal cinematic streaming library. Watch local media with a Netflix-style interface.">
  <title>CapsStream</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="CapsStream">

  <!-- Early PWA Install Prompt Capture -->
  <script>
    window.__deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('capsstream:pwa-installable'));
    });
  </script>

  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="shortcut icon" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/static/img/icon-512.png">

  <!-- Icons (Phosphor) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>



  <!-- Vue 3 + Vue Router 4 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/main.css?v={{ version }}&t={{ t }}">
</head>
<body>
  <!-- Startup Splash — Adult Swim style, once per browser session.
           Fully standalone (inline styles + vanilla JS) so it can never be
           broken by the Vue app or stylesheet caching. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-splash .as-logo {
      display: inline-flex;
      align-items: center;
      font-family: "Plus Jakarta Sans", "Geist", sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 3.4rem);
      color: #fff;
      letter-spacing: -0.045em;
      background: #000;
      padding: 0.08em 0.35em 0.12em;
      line-height: 1;
      white-space: nowrap;
    }
    #app-splash .bracket {
      font-size: 1.25em;
      position: relative;
      top: -0.03em;
      line-height: 0.85;
    }
    #app-splash .left-text { margin-right: 0.1em; }
    #app-splash .right-text { margin-left: 0.1em; }
    #app-splash .big-s {
      font-size: 1.22em;
      line-height: 0;
    }
  </style>
  <div id="app-splash">
    <div class="as-logo">
      <span class="bracket">[</span><span class="left-text part" style="opacity:0">caps</span><span class="right-text part" style="opacity:0"><span class="big-s">S</span>tream</span><span class="bracket">]</span>
    </div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById("app-splash");
      if (!splash) return;

      // Once per browser session
      try {
        if (sessionStorage.getItem("cs_splash_done")) { splash.remove(); return; }
      } catch (e) {}

      var bell = new Audio("/static/sfx/bell.wav");
      bell.volume = 1;
      bell.preload = "auto";
      var bellPlayed = false;
      var words = splash.querySelectorAll(".part");
      var capsShown = false;
      var streamShown = false;
      var animStarted = false;
      var startTime = null;
      var audioStartTime = null;

      function showCaps() {
        if (capsShown) return;
        capsShown = true;
        words[0].style.opacity = "1";
      }

      function onStreamShown() {
        if (streamShown) return;
        showCaps();
        streamShown = true;
        words[1].style.opacity = "1";

        // Always wait for "Stream" to show, then wait 1500ms before fading out
        setTimeout(function () {
          if (!splash || !splash.parentNode) return;
          splash.style.transition = "opacity 0.55s ease";
          splash.style.opacity = "0";

          setTimeout(function () {
            try { sessionStorage.setItem("cs_splash_done", "1"); } catch (e) {}
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 550);
        }, 1500);
      }

      function syncFrame(now) {
        if (!splash || !splash.parentNode) return;

        var elapsed;
        if (bellPlayed && audioStartTime !== null) {
          elapsed = now - audioStartTime;
          if (bell.currentTime > 0) {
            var ct = bell.currentTime * 1000;
            if (Math.abs(elapsed - ct) > 60) {
              audioStartTime = now - ct;
              elapsed = ct;
            }
          }
        } else {
          elapsed = now - startTime;
        }

        // First ding onset ≈ 415 ms -> "caps"
        if (!capsShown && elapsed >= 415) {
          showCaps();
        }
        // Second ding onset ≈ 1615 ms -> "Stream"
        if (!streamShown && elapsed >= 1615) {
          onStreamShown();
        }

        if (!streamShown) {
          requestAnimationFrame(syncFrame);
        }
      }

      function startAnimation() {
        if (animStarted) return;
        animStarted = true;
        startTime = performance.now();
        requestAnimationFrame(syncFrame);
      }

      function markAudioPlaying() {
        bellPlayed = true;
        var now = performance.now();
        var ct = (bell.currentTime || 0) * 1000;
        audioStartTime = now - ct;
        if (!animStarted) {
          startAnimation();
        }
      }

      bell.addEventListener("playing", markAudioPlaying);
      bell.addEventListener("play", markAudioPlaying);

      function tryBell() {
        if (bellPlayed) return;
        var p = bell.play();
        if (p && p.then) {
          p.then(function () {
            markAudioPlaying();
          }).catch(function () {
            // Autoplay blocked — start visual timer anyway so UI doesn't hang
            startAnimation();
          });
        } else {
          markAudioPlaying();
        }
      }

      tryBell();

      // Autoplay policy fallback: user interaction unlocks audio
      ["pointerdown", "keydown"].forEach(function (evt) {
        window.addEventListener(evt, tryBell, { once: true });
      });

      // Fallback safety timer: ensure animation starts even if audio takes time to load
      setTimeout(function () {
        if (!animStarted) startAnimation();
      }, 50);
    })();
  </script>

  <div id="app"></div>

  <!-- Vue App -->
  <script src="/static/js/app.js?v={{ version }}&t={{ t }}"></script>

  <!-- PWA Service Worker Registration & Live Update Dispatcher -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function (reg) {
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('capsstream:sw-updated', { detail: reg }));
                  }
                });
              }
            });
          })
          .catch(function (err) {
            console.warn('[PWA] ServiceWorker registration skipped/failed:', err);
          });
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapsStream — Server Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{text-align:center;padding:3rem 2.5rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;max-width:440px;width:90%}
    .icon{font-size:3.5rem;margin-bottom:1.2rem;display:block;animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:.5rem}
    p{font-size:.93rem;color:#9a9aaa;line-height:1.6;margin-bottom:1.5rem}
    .hint{font-size:.82rem;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;color:#6b6b80;margin-bottom:1.5rem}
    .hint code{color:#a78bfa;font-size:.85rem}
    .status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:99px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);margin-bottom:1.5rem;transition:all .4s ease}
    .status.online{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:#10b981}
    .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.7);animation:blink 1.4s ease-in-out infinite}
    .dot.green{background:#10b981;box-shadow:0 0 10px rgba(16,185,129,.9);animation:none}
    @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
    .logo{font-size:.78rem;color:#3a3a4a;margin-top:2rem;letter-spacing:.05em;text-transform:uppercase}
  </style>
</head>
<body>
<div class="card">
  <span class="icon">⏻</span>
  <h1>Server Offline</h1>
  <p>The CapsStream server has stopped cleanly.<br>To resume, launch the server again.</p>
  <div class="hint">Run <code>start.bat</code> or <code>Start CapsStream Silent.vbs</code> in your project folder to restart.</div>
  <div class="status" id="st"><div class="dot" id="dot"></div><span id="stxt">Waiting for server to come back online...</span></div>
  <div class="logo">CapsStream</div>
</div>
<script>
  var online=false;
  async function probe(){try{var r=await fetch('/api/system/info?t='+Date.now(),{cache:'no-store'});if(r.ok){var d=await r.json().catch(function(){return null});if(d&&d.version)return true}}catch(e){}return false}
  async function poll(){if(online)return;var up=await probe();if(up){online=true;document.getElementById('dot').classList.add('green');document.getElementById('st').classList.add('online');document.getElementById('stxt').textContent='🟢 Server detected — reloading...';setTimeout(function(){window.location.href='/'},900)}}
  setInterval(poll,2000);
</script>
</body>
</html>
